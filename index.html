<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Production Board</title>
    <style>
        :root {
            --bg: #0d0d11;
            --card: #15151c;
            --purple: #9d4edd;
            --green: #38b000;
            --blue: #0077b6;
            --text: #f8f9fa;
            --dim: #8b8e9f;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; }
        .vault { max-width: 580px; margin: 10px auto; background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #252533; padding-bottom: 15px; }
        .header h2 { margin: 0; color: var(--purple); font-size: 24px; }
        .track { background: #1b1b26; border-radius: 10px; padding: 14px; margin-bottom: 14px; border: 1px solid #2a2a3a; }
        .track-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .track-title h4 { margin: 0; font-size: 16px; }
        .track-title p { margin: 0; font-size: 12px; color: var(--dim); }
        .audio-row { display: flex; align-items: center; gap: 10px; background: #0b0b10; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
        .play-trigger { background: var(--purple); border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; min-width: 70px; }
        .rail { flex-grow: 1; background: #252535; height: 6px; border-radius: 3px; position: relative; overflow: hidden; }
        .fill { background: var(--purple); height: 100%; width: 0%; transition: width 0.1s linear; }
        .stamp { font-size: 11px; color: var(--dim); font-family: monospace; }
        
        .voting-hub { border-top: 1px dashed #2a2a3a; padding-top: 10px; }
        .email-gate { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .email-gate label { font-size: 11px; color: var(--dim); }
        .email-input { background: #0b0b10; border: 1px solid #3a3a52; border-radius: 4px; padding: 6px 10px; color: white; font-size: 12px; }
        .email-input:focus { outline: none; border-color: var(--purple); }
        
        .action-row { display: flex; justify-content: space-between; align-items: center; }
        .label-v { font-size: 12px; color: var(--dim); }
        .btn-group { display: flex; gap: 6px; }
        .v-btn { padding: 5px 12px; border: 1px solid #3a3a52; background: transparent; color: white; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .v-btn:hover { background: rgba(157, 78, 221, 0.1); border-color: var(--purple); }
        
        .meter { height: 12px; background: #0b0b10; border-radius: 6px; margin-top: 8px; display: flex; overflow: hidden; }
        .meter-yes { background: var(--green); height: 100%; width: 0%; transition: width 0.3s ease; }
        .meter-no { background: #cf142b; height: 100%; width: 0%; transition: width 0.3s ease; }
        .final-badge { font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-album { background: rgba(56, 176, 0, 0.2); color: var(--green); border: 1px solid var(--green); }
        .badge-single { background: rgba(0, 119, 182, 0.2); color: var(--blue); border: 1px solid var(--blue); }
        .lockout-msg { font-size: 12px; color: #ffb703; font-style: italic; }

        .holla-desk { background: #1a1a24; border: 1px dashed var(--purple); border-radius: 12px; padding: 15px; margin-top: 20px; }
        .tier-card { background: #121217; border: 1px solid #2d2d3d; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-bottom: 8px; }
        .tier-card.active { border-color: var(--purple); background: rgba(157, 78, 221, 0.05); }
        .tier-info { display: flex; align-items: center; gap: 10px; }
        .tier-checkbox { accent-color: var(--purple); width: 16px; height: 16px; }
        .checkout-box { background: #111114; border-radius: 8px; padding: 12px; margin-top: 15px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
        .checkout-row { display: flex; justify-content: space-between; }
        .gate-btn { width: 100%; background: var(--purple); color: white; border: none; border-radius: 6px; padding: 12px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 14px; }
        .gate-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="vault">
    <div class="header">
        <h2>🎵 Executive Production Board</h2>
        <p style="margin:4px 0 0 0; font-size:12px; color:var(--dim);">10 community votes permanently sets the deployment track format.</p>
    </div>

    <audio id="plugin-audio-node"></audio>

    <!-- Track 1 -->
    <div class="track" id="t1">
        <div class="track-header">
            <div class="track-title">
                <h4>1. I'm Okay</h4>
                <p>A Rising Superstar</p>
            </div>
            <div id="status-1"></div>
        </div>
        <div class="audio-row">
            <button class="play-trigger" onclick="runTrack(1, 'https://googleapis.com')">Play</button>
            <div class="rail"><div class="fill" id="f1"></div></div>
            <div class="stamp" id="s1">0:00</div>
        </div>
        <div class="voting-hub">
            <div class="email-gate" id="gate-1">
                <label>Verify email to log your official vote:</label>
                <input type="email" id="email-1" class="email-input" placeholder="producer@example.com">
            </div>
            <div class="action-row">
                <span class="label-v" id="count-1">Progress: Loading...</span>
                <div class="btn-group" id="group-1">
                    <button class="v-btn" onclick="logVote(1, true)">👍 Yes</button>
                    <button class="v-btn" onclick="logVote(1, false)">👎 No</button>
                </div>
            </div>
            <div class="meter" id="m1">
                <div class="meter-yes" id="my1"></div>
                <div class="meter-no" id="mn1"></div>
            </div>
            <div class="label-v" id="pct-text-1" style="display:flex; justify-content:space-between; margin-top:4px;"></div>
        </div>
    </div>
